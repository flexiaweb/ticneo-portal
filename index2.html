<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ticneo Portal - Inicio de Sesión</title>
  <link rel="stylesheet" href="css/styles.css">
  <script type="module" src="js/auth.js"></script>
</head>
<body class="login-page">
  <div class="login-card">
    <div class="brand-icon">T</div>
    <h2>Ticneo Portal</h2>
    <p>Ingresa tus credenciales de usuario.</p>

    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label for="username">Correo Electrónico</label>
        <input type="email" id="username" placeholder="usuario@ticneo.com" required autocomplete="email">
      </div>
      
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>
      
      <button type="submit" class="btn-primary btn-block">Iniciar Sesión</button>
      
      <div id="errorMsg" class="error-msg">⚠️ Credenciales incorrectas.</div>
    </form>
  </div>

  <div id="forcePasswordModal" class="modal-overlay">
    <div class="modal-card modal-card-sm">
      <div class="modal-header">
        <h3>🔒 Actualizar Contraseña</h3>
      </div>
  
      <p class="modal-description">Es tu primer inicio de sesión o tu contraseña ha sido reseteada. Por seguridad, debes establecer una contraseña nueva.</p>
  
      <div id="resetErrorMsg" class="alert-error"></div>
  
      <form id="forcePasswordForm" class="form-flex">
        <div class="form-group">
          <label for="newPasswordInput">Nueva Contraseña *</label>
          <input type="password" id="newPasswordInput" required minlength="6" placeholder="Mínimo 6 caracteres">
        </div>
  
        <div class="form-group">
          <label for="confirmPasswordInput">Confirmar Nueva Contraseña *</label>
          <input type="password" id="confirmPasswordInput" required minlength="6" placeholder="Repite la contraseña">
        </div>
  
        <div class="modal-footer">
          <button type="submit" id="btnSubmitReset" class="btn-primary btn-block">Guardar y Entrar</button>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
