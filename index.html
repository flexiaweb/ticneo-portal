<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Almacén - Ticneo Portal</title>
    <link rel="stylesheet" href="styles.css">
    
    <!-- Carga de módulos de autenticación y lógica principal -->
    <script type="module" src="auth.js"></script>
    <script type="module" src="app.js"></script>
  </head>
<body style="opacity: 0;">

  <!-- Encabezado Principal -->
  <header>
    <a href="index.html" class="brand">
      <div class="brand-icon">T</div>
      <div class="brand-title">
        <h1>Ticneo Portal</h1>
        <p>Departamento de Sistemas</p>
      </div>
    </a>
    <div class="user-info">
      <div class="status-badge">
        <div class="status-dot"></div>
        <span>Sistemas Operativos</span>
      </div>
    </div>
    <button onclick="logout()" class="btn-secondary" style="padding: 0.4rem 0.8rem; font-size: 0.85rem;">
      🚪 Salir
    </button>
  </header>

  <!-- Contenido Principal -->
  <main>
    <div class="section-header">
      <h2>Selección de Módulo</h2>
      <p>Selecciona el módulo al que deseas acceder:</p>
    </div>

    <!-- Grid con la tarjeta de Almacén -->
    <div class="dashboard-grid">

      <!-- Caja Almacén de Sistemas -->
      <a href="almacen.html" class="panel-card">
        <div class="card-top">
          <div class="card-icon">📦</div>
          <span class="card-badge badge-primary">Principal</span>
        </div>
        <div>
          <h3 class="card-title">Almacén de Sistemas</h3>
          <p class="card-desc">Control de inventario, equipos en stock, periféricos y registro de entradas/salidas de hardware.</p>
        </div>
        <div class="card-footer">
          <span>Abrir módulo &rarr;</span>
          <span style="color: var(--text-muted);">Stock Activo</span>
        </div>
      </a>

    </div>
  </main>

</body>
</html>
