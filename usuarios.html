<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Usuarios - TicNeo</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="auth.js"></script>
  <script type="module" src="usuarios.js"></script>
</head>
<body>
  <!-- Header / Nav (Ajusta los enlaces según tu menú) -->
  <header class="navbar">
    <div class="logo">TicNeo Admin</div>
    <nav>
      <a href="index.html">Dashboard</a>
      <a href="almacen.html">Almacén</a>
      <a href="usuarios.html" class="active">Usuarios</a>
      <button onclick="logout()" class="btn-logout">Cerrar Sesión</button>
    </nav>
  </header>

  <main class="container">
    <div class="page-header">
      <h2>Gestión de Usuarios</h2>
      <button onclick="openUserModal()" class="btn-primary">+ Nuevo Usuario</button>
    </div>

    <!-- Tabla de Usuarios -->
    <div class="table-card">
      <table>
        <thead>
          <tr>
            <th>Nombre</th>
            <th>Correo Electrónico</th>
            <th>Rol</th>
            <th>Estado</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="usersTableBody">
          <tr><td colspan="5" style="text-align: center;">Cargando usuarios...</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <!-- Modal Crear / Editar Usuario -->
  <div id="userModal" class="modal">
    <div class="modal-content">
      <h3 id="modalTitle">Nuevo Usuario</h3>
      <form id="userForm" onsubmit="saveUser(event)">
        <input type="hidden" id="userId">
        
        <div class="form-group">
          <label>Nombre Completo</label>
          <input type="text" id="userName" required>
        </div>

        <div class="form-group">
          <label>Correo Electrónico</label>
          <input type="email" id="userEmail" required>
        </div>

        <div class="form-group">
          <label>Rol de Usuario</label>
          <select id="userRole" required>
            <option value="usuario">Usuario Estándar</option>
            <option value="almacen">Gestor de Almacén</option>
            <option value="admin">Administrador</option>
          </select>
        </div>

        <div class="form-group">
          <label>Estado</label>
          <select id="userStatus" required>
            <option value="true">Activo</option>
            <option value="false">Inactivo (Bloqueado)</option>
          </select>
        </div>

        <div class="modal-actions">
          <button type="button" onclick="closeUserModal()" class="btn-secondary">Cancelar</button>
          <button type="submit" id="btnSaveUser" class="btn-primary">Guardar Usuario</button>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
