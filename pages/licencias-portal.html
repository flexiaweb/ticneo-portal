<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Licencias - Ticneo</title>
  <link rel="stylesheet" href="../css/styles.css"> <!-- O tu ruta CSS global -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- BARRA DE NAVEGACIÓN SUPERIOR -->
  <header class="navbar">
    <div class="nav-left">
      <a href="dashboard.html" class="btn-back"><i class="fa-solid fa-arrow-left"></i> Dashboard</a>
      <h2>🔑 Panel de Licencias</h2>
    </div>
    <div class="nav-right">
      <span id="userInfoDisplay">Cargando...</span>
      <button onclick="logout()" class="btn-logout"><i class="fa-solid fa-right-from-bracket"></i> Salir</button>
    </div>
  </header>

  <!-- CONTENIDO PRINCIPAL -->
  <main class="main-container">

    <!-- BARRA SUPERIOR DE ACCIONES Y BÚSQUEDA -->
    <div class="top-controls">
      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="searchInputLicencias" placeholder="Buscar por código..." oninput="filtrarLicencias()">
      </div>
      <button class="btn-primary" onclick="abrirModalCrearLicencia()">
        <i class="fa-solid fa-plus"></i> Nueva Licencia
      </button>
    </div>

    <!-- TARJETAS DE MÉTRICAS / KPIS -->
    <div class="kpi-grid">
      <div class="kpi-card">
        <h3>Total Licencias</h3>
        <p id="kpiTotalLicencias">0</p>
      </div>
      <div class="kpi-card">
        <h3>Licencias Activas</h3>
        <p id="kpiLicenciasActivas" style="color: #4ade80;">0</p>
      </div>
      <div class="kpi-card">
        <h3>Licencias Agotadas</h3>
        <p id="kpiLicenciasAgotadas" style="color: #f87171;">0</p>
      </div>
    </div>

    <!-- TABLA DE LICENCIAS -->
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Documento / Código</th>
            <th>Duración</th>
            <th>Usos (Actual / Máx)</th>
            <th>Disponibles</th>
            <th>Estado</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="tablaLicenciasBody">
          <tr>
            <td colspan="6" style="text-align:center; padding: 2rem;">Cargando licencias...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>

  <!-- MODAL: CREAR NUEVA LICENCIA -->
  <div id="modalCrearLicencia" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Generar Nueva Licencia</h3>
        <button class="btn-close" onclick="cerrarModalCrearLicencia()">&times;</button>
      </div>
      <form id="formNuevaLicencia">
        <div class="form-group">
          <label for="inputDocId">ID del Documento (Nombre único)</label>
          <input type="text" id="inputDocId" placeholder="Ej: TICNEO-2026-PREMIUM" required>
        </div>
        <div class="form-group">
          <label for="inputCodigo">Código de Licencia (String de activación)</label>
          <div style="display: flex; gap: 0.5rem;">
            <input type="text" id="inputCodigo" placeholder="Escribe o genera un código" required>
            <button type="button" class="btn-secondary" onclick="generarCodigoAleatorio()">Generar</button>
          </div>
        </div>
        <div class="form-group">
          <label for="inputDias">Días de Duración</label>
          <input type="number" id="inputDias" value="30" min="1" required>
        </div>
        <div class="form-group">
          <label for="inputUsosMax">Número Máximo de Usuarios</label>
          <input type="number" id="inputUsosMax" value="1" min="1" required>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn-secondary" onclick="cerrarModalCrearLicencia()">Cancelar</button>
          <button type="submit" id="btnGuardarLicencia" class="btn-primary">Crear Licencia</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL: VER USUARIOS QUE ACTIVARON LA LICENCIA -->
  <div id="modalVerUsuarios" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="tituloModalUsuarios">Usuarios Asignados</h3>
        <button class="btn-close" onclick="cerrarModalUsuarios()">&times;</button>
      </div>
      <div id="listaUsuariosContainer" style="padding: 1rem 0;">
        <p>Cargando usuarios...</p>
      </div>
      <div class="modal-footer">
        <button class="btn-secondary" onclick="cerrarModalUsuarios()">Cerrar</button>
      </div>
    </div>
  </div>

  <!-- SCRIPTS -->
  <script type="module" src="../js/auth.js"></script>
  <script type="module" src="../js/licencias-admin.js"></script>
</body>
</html>
