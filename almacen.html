<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Almacén de Sistemas - Ticneo Portal</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Encabezado Principal -->
  <header>
    <a href="index.html" class="brand">
      <div class="brand-icon">T</div>
      <div class="brand-title">
        <h1>Ticneo Portal</h1>
        <p>Departamento de Sistemas</p>
      </div>
    </a>
    <div class="user-info">
      <div class="status-badge">
        <div class="status-dot"></div>
        <span>Módulo Almacén</span>
      </div>
    </div>
  </header>

  <!-- Contenido Principal -->
  <main>
    <a href="index.html" class="btn-back">&larr; Volver al Portal Principal</a>

    <div class="section-header" style="display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 1rem;">
      <div>
        <h2>📦 Almacén de Sistemas</h2>
        <p>Gestión de Inventario e Histórico de Entradas y Salidas.</p>
      </div>
      <div style="display: flex; gap: 0.5rem;">
        <button class="btn-secondary" onclick="loadSheetData()" title="Refrescar">🔄 Actualizar</button>
        <button class="btn-primary" onclick="openModal()">+ Nuevo Movimiento</button>
      </div>
    </div>

    <!-- Tarjetas KPI Resumen -->
    <div class="kpi-grid">
      <div class="kpi-card">
        <span class="kpi-title">Total Registros</span>
        <span class="kpi-value" id="kpiTotal">0</span>
      </div>
      <div class="kpi-card">
        <span class="kpi-title">Total Entradas</span>
        <span class="kpi-value entrada" id="kpiEntradas">0</span>
      </div>
      <div class="kpi-card">
        <span class="kpi-title">Total Salidas</span>
        <span class="kpi-value salida" id="kpiSalidas">0</span>
      </div>
    </div>

    <!-- Controles (Con pestañas de Vista) -->
    <div class="table-controls" style="display: flex; justify-content: space-between; flex-wrap: wrap; gap: 1rem;">
      <div style="display: flex; gap: 0.5rem;">
        <button id="btnViewHistory" class="btn-view active" onclick="setView('history')">📜 Histórico</button>
        <button id="btnViewStock" class="btn-view" onclick="setView('stock')">📊 Stock Actual</button>
      </div>

      <div style="display: flex; gap: 0.75rem; flex-wrap: wrap;">
        <div class="search-box">
          <input type="text" id="searchInput" placeholder="Buscar..." oninput="filterTable()">
        </div>
        <div class="filter-group" id="typeFilterContainer">
          <div class="filter-select">
            <select id="typeFilter" onchange="filterTable()">
              <option value="ALL">Todos los Movimientos</option>
              <option value="Entrada">Solo Entradas</option>
              <option value="Salida">Solo Salidas</option>
            </select>
          </div>
        </div>
      </div>
    </div>

    <!-- Contenedor de Tabla -->
    <div class="table-container">
      <table class="data-table">
        <thead id="tableHeader">
          <!-- Dinámico mediante JS -->
        </thead>
        <tbody id="tableBody">
          <tr>
            <td colspan="8" class="loading-box">Cargando datos...</td>
          </tr>
        </tbody>
      </table>
    </div>

  </main>

  <!-- Modal / Formulario Flotante -->
  <div id="movementModal" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-header">
        <h3>Registrar Movimiento de Almacén</h3>
        <button class="btn-close" onclick="closeModal()">&times;</button>
      </div>
      <form id="addMovementForm" onsubmit="submitForm(event)">
        <div class="form-grid">
          <div class="form-group">
            <label for="fecha">Fecha</label>
            <input type="date" id="fecha" required>
          </div>

          <!-- Input con Autocompletado Datalist -->
          <div class="form-group">
            <label for="articulo">Artículo / Insumo</label>
            <input type="text" id="articulo" list="articlesList" placeholder="Escribe o selecciona..." autocomplete="off" required>
            <datalist id="articlesList">
              <!-- Se autocompleta con JavaScript -->
            </datalist>
          </div>

          <div class="form-group">
            <label for="tipoMov">Tipo de Movimiento</label>
            <select id="tipoMov" required>
              <option value="Entrada">Entrada</option>
              <option value="Salida">Salida</option>
            </select>
          </div>
          <div class="form-group">
            <label for="cantidad">Cantidad</label>
            <input type="number" id="cantidad" min="1" value="1" required>
          </div>
          <div class="form-group">
            <label for="tipoSolicitante">Tipo de Solicitante</label>
            <input type="text" id="tipoSolicitante" placeholder="Ej. Empleado, Dpto">
          </div>
          <div class="form-group">
            <label for="detalleSolicitante">Detalle Solicitante</label>
            <input type="text" id="detalleSolicitante" placeholder="Ej. Juan Pérez">
          </div>
          <div class="form-group full-width">
            <label for="notas">Notas / Observaciones</label>
            <textarea id="notas" rows="3" placeholder="Detalles del movimiento..."></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn-secondary" onclick="closeModal()">Cancelar</button>
          <button type="submit" id="btnSubmit" class="btn-primary">Guardar Registro</button>
        </div>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
