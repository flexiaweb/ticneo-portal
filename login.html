<!DOCTYPE html>

<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Acceso - Ticneo Portal</title>

  <link rel="stylesheet" href="styles.css">

  <style>

    body {

      display: flex;

      align-items: center;

      justify-content: center;

      min-height: 100vh;

      margin: 0;

      background-color: var(--bg-main, #0b0914);

    }

    .login-card {

      background: var(--bg-card, #130f26);

      border: 1px solid var(--border-color, #2d264f);

      border-radius: 16px;

      padding: 2.5rem;

      width: 100%;

      max-width: 380px;

      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);

      text-align: center;

    }

    .login-card .brand-icon {

      margin: 0 auto 1rem auto;

      width: 50px;

      height: 50px;

      font-size: 1.5rem;

      background: var(--primary, #7c3aed);

      color: #fff;

      display: flex;

      align-items: center;

      justify-content: center;

      border-radius: 12px;

      font-weight: bold;

    }

    .login-card h2 { color: #fff; margin-bottom: 0.5rem; }

    .login-card p { color: var(--text-muted, #a1a1aa); font-size: 0.9rem; margin-bottom: 1.5rem; }

    .form-group { text-align: left; margin-bottom: 1.2rem; }

    .form-group label { display: block; color: #ccc; font-size: 0.85rem; margin-bottom: 0.4rem; }

    .form-group input {

      width: 100%; padding: 0.75rem; border-radius: 8px;

      background: rgba(255,255,255,0.05); border: 1px solid var(--border-color, #2d264f);

      color: #fff; box-sizing: border-box;

    }

    .error-msg { color: #f87171; font-size: 0.85rem; margin-top: 1rem; display: none; }

  </style>

</head>

<body>



  <div class="login-card">

    <div class="brand-icon">T</div>

    <h2>Ticneo Portal</h2>

    <p>Ingresa tus credenciales de usuario.</p>



    <form id="loginForm" onsubmit="handleLogin(event)">

      <div class="form-group">

        <label for="username">Correo Electrónico</label>

        <input type="email" id="username" placeholder="usuario@ticneo.com" required autocomplete="email">

      </div>

      

      <div class="form-group">

        <label for="password">Contraseña</label>

        <input type="password" id="password" placeholder="••••••••" required>

      </div>



      <button type="submit" class="btn-primary" style="width: 100%; justify-content: center; margin-top: 1rem;">

        Iniciar Sesión

      </button>



      <div id="errorMsg" class="error-msg">⚠️ Credenciales incorrectas.</div>

    </form>

  </div>



  <!-- Cargar Auth módulo JS -->

  <script type="module" src="js/auth.js"></script>

</body>

</html>
